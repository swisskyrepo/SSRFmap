[project]
name = "ssrfmap"
version = "0.1.0"
description = "Automatic SSRF fuzzer and exploitation tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnslib==0.9.24",
    "dnspython==2.6.1",
    "flask==3.0.3",
    "requests==2.31.0",
    "tldextract==5.1.2",
]

[dependency-groups]
lint = [
    "ruff>=0.16.2",
]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false
default-groups = ["lint", "test"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I", "B", "W605"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=core.requester",
    "--cov=core.utils",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]
